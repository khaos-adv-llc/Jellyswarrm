name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Validate build compiles
        working-directory: project
        run: |
          xcodebuild build \
            -scheme Jellyswarrm \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          zip -r jellyswarrm-${{ steps.version.outputs.VERSION }}-source.zip project/ \
            -x "*.DS_Store" -x "__MACOSX/*" -x "*.git/*" -x "*/.build/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Jellyswarrm ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ### Installation

            This release contains the Swift Package source code. Open `project/Package.swift` in Xcode 16+ to build for your target platform.

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup instructions.
          files: |
            jellyswarrm-${{ steps.version.outputs.VERSION }}-source.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
